
name: Build PS2 ELF

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t isaac-ps2-builder .

      - name: Compile ELF
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            isaac-ps2-builder

      - name: Upload ELF
        uses: actions/upload-artifact@v4
        with:
          name: isaac-ps2
          path: isaac-ps2.elf
