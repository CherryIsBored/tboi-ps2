
name: Build PS2 ELF

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ps2dev/ps2dev:latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Compile PS2 game
        run: |
          cd "$GITHUB_WORKSPACE"
          make clean
          make

      - name: Upload ELF
        uses: actions/upload-artifact@v4
        with:
          name: isaac-ps2
          path: isaac-ps2.elf
