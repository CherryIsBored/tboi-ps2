
name: Build PS2 ELF

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ps2dev/ps2dev:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify PS2 toolchain
        run: |
          echo "Checking PS2 compiler..."
          which mips64r5900el-ps2-elf-g++
          echo "Checking PS2SDK..."
          echo "$PS2SDK"

      - name: Compile game
        run: make clean all

      - name: Upload ELF
        uses: actions/upload-artifact@v4
        with:
          name: isaac-ps2
          path: isaac-ps2.elf
