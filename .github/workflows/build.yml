
name: Build PS2 ELF

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile PS2 game
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            -w /src \
            --entrypoint /bin/bash \
            ghcr.io/ps2dev/ps2dev:latest \
            -lc 'export PATH="$PS2DEV/bin:$PS2DEV/ee/bin:$PS2DEV/iop/bin:$PS2DEV/dvp/bin:$PS2SDK/bin:$PATH"; make clean all'

      - name: Upload ELF
        uses: actions/upload-artifact@v4
        with:
          name: isaac-ps2
          path: isaac-ps2.elf
