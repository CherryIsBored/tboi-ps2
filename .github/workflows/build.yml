
name: Build PS2 ELF

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build compiler image
        run: docker build -t isaac-ps2-builder .

      - name: Compile game
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            -w /src \
            isaac-ps2-builder

      - name: Upload ELF
        uses: actions/upload-artifact@v4
        with:
          name: ISAAC-PS2
          path: ISAAC-PS2.ELF
