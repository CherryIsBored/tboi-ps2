
name: Build PS2 ELF

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Compile for PlayStation 2
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            -w /src \
            ghcr.io/ps2dev/ps2sdk:latest \
            bash -lc 'make clean && make'

      - name: Check ELF
        run: test -f isaac-ps2.elf

      - name: Upload ELF
        uses: actions/upload-artifact@v4
        with:
          name: isaac-ps2
          path: isaac-ps2.elf
